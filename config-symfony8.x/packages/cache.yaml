imports:
    - { resource: 'cache.php' }

framework:
    cache:
        default_redis_provider: redis://redis

        # Namespaced pools use the above "app" backend by default
        pools:
            # creates a "results.cache" service and autowireable via "CacheInterface $resultsCache"
            results.cache:
                adapter: cache.app

            # creates a "doctrine.result_cache_pool" service and autowireable via "CacheInterface $downloadsCache"
            downloads.cache:
                adapter: cache.adapter.filesystem

            doctrine.meta_cache_pool:
                adapter: cache.app

            # The merged configs of the Server Manager (see ConfigLoader): large entries (about 1.4 MB each), valid for
            # as long as the config and its parent files are unchanged. A pool of its own, so that it can be cleared
            # (bin/console cache:pool:clear config.cache) without clearing the other caches of cache.app. It follows
            # cache.app (Redis in Docker, see FRAMEWORK_CACHE_APP); to keep it on the local disk instead, use
            # "adapter: cache.adapter.filesystem".
            config.cache:
                adapter: cache.app

# Disabled in Symfony by default:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null
