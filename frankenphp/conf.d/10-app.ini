; MSP, added for msp specifically on top of Symfony docker
; NOTE: gamesave session uploads (/manager/gamesave/upload) no longer go through a single
; POST - they're chunked client-side (see gamesave-upload_controller.js), so these two no
; longer need to accommodate a whole session zip. Verify no OTHER upload path in the app
; (e.g. game config file uploads) still needs a bigger single-request limit before shipping this.
upload_max_filesize = 32M ; only governs actual $_FILES/multipart uploads; chunk requests are raw-body and ignore this entirely
memory_limit = 512M ; maximum amount of memory a script is allowed to allocate - set high for processing big game saves
max_execution_time = 840 ; maximum time in seconds a script is allowed to run - set high to create & open big game saves
post_max_size = 32M ; covers one gamesave chunk (8MB) plus headroom; was 300M when uploads were single-shot
apc.enabled = 1
apc.shm_size = 128M
implicit_flush=Off
; MSP, added "E" = Environment variable parsing
;  *Not* following dunglas/symfony-docker. They removed it here: https://github.com/dunglas/symfony-docker/pull/582/files
variables_order = "EGPCS"

expose_php = 0
date.timezone = UTC
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.enable_file_override = 1

; Log PHP Errors to stderr
error_log = /proc/self/fd/2
log_errors = On
error_reporting = E_ERROR | E_PARSE | E_CORE_ERROR | E_COMPILE_ERROR | E_USER_ERROR | E_RECOVERABLE_ERROR
display_errors = Off
